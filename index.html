<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Ball — Revamped</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a12;
      color: #e0e0ff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 { margin-bottom: 0.5rem; font-weight: 600; letter-spacing: 0.05em; }
    #game-container {
      position: relative;
      border: 2px solid #334;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 150, 255, 0.25);
      background: #111122;
    }
    canvas { display: block; border-radius: 10px; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 18, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      text-align: center;
      gap: 1rem;
    }
    #overlay.hidden { display: none; }
    button {
      background: #0095dd;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #00b4ff; }
    .stats {
      margin-top: 1rem;
      font-size: 0.95rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>Bouncing Ball</h1>
  <div id="game-container">
    <canvas id="canvas" width="480" height="320"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Bouncing Ball</h2>
      <p id="overlay-msg">Use mouse or arrow keys to move the paddle.<br>Don't let the ball drop!</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>
  <div class="stats">
    Score: <span id="score">0</span> &nbsp;|&nbsp;
    Lives: <span id="lives">3</span> &nbsp;|&nbsp;
    High Score: <span id="highscore">0</span>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const highscoreEl = document.getElementById('highscore');

    let ballRadius = 12;
    let x, y, dx, dy;
    let paddleWidth = 90;
    let paddleHeight = 12;
    let paddleX;
    let rightPressed = false;
    let leftPressed = false;
    let score = 0;
    let lives = 3;
    let highScore = parseInt(localStorage.getItem('bb-highscore') || '0');
    let gameRunning = false;
    let particles = [];
    let animationId;

    highscoreEl.textContent = highScore;

    function resetBall() {
      x = canvas.width / 2;
      y = canvas.height - 40;
      dx = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 2);
      dy = -4 - Math.random() * 1.5;
    }

    function resetGame() {
      score = 0;
      lives = 3;
      paddleX = (canvas.width - paddleWidth) / 2;
      particles = [];
      resetBall();
      updateUI();
    }

    function updateUI() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
    }

    function spawnParticles(px, py, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: px,
          y: py,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1,
          size: Math.random() * 4 + 2
        });
      }
    }

    function drawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        p.vy += 0.1;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 180, 255, ${p.life})`;
        ctx.fill();
      }
    }

    function drawBall() {
      // Glow
      ctx.beginPath();
      ctx.arc(x, y, ballRadius + 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 149, 221, 0.25)';
      ctx.fill();

      // Ball
      const gradient = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, ballRadius);
      gradient.addColorStop(0, '#88eeff');
      gradient.addColorStop(1, '#0095dd');
      ctx.beginPath();
      ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    function drawPaddle() {
      const gradient = ctx.createLinearGradient(paddleX, 0, paddleX + paddleWidth, 0);
      gradient.addColorStop(0, '#0066aa');
      gradient.addColorStop(0.5, '#00aaff');
      gradient.addColorStop(1, '#0066aa');
      ctx.beginPath();
      ctx.roundRect(paddleX, canvas.height - paddleHeight - 8, paddleWidth, paddleHeight, 6);
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00aaff';
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function collisionDetection() {
      // Walls
      if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
        dx = -dx;
        spawnParticles(x, y, 5);
      }
      if (y + dy < ballRadius) {
        dy = -dy;
        spawnParticles(x, y, 5);
      } else if (y + dy > canvas.height - ballRadius - paddleHeight - 8) {
        if (x > paddleX && x < paddleX + paddleWidth) {
          dy = -Math.abs(dy) * 1.02;
          dx += (x - (paddleX + paddleWidth / 2)) * 0.05;
          score++;
          spawnParticles(x, y, 12);
          if (score % 5 === 0 && ballRadius < 18) ballRadius += 0.5;
          updateUI();
        } else if (y + dy > canvas.height - ballRadius) {
          lives--;
          updateUI();
          spawnParticles(x, y, 20);
          if (lives <= 0) {
            gameOver();
          } else {
            resetBall();
          }
        }
      }
    }

    function gameOver() {
      gameRunning = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('bb-highscore', highScore);
        highscoreEl.textContent = highScore;
      }
      document.getElementById('overlay-title').textContent = 'Game Over';
      document.getElementById('overlay-msg').textContent = `Final Score: ${score}`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
      cancelAnimationFrame(animationId);
    }

    function draw() {
      if (!gameRunning) return;

      ctx.fillStyle = '#0c0c18';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawParticles();
      drawBall();
      drawPaddle();
      collisionDetection();

      // Paddle movement
      if (rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 8;
      if (leftPressed && paddleX > 0) paddleX -= 8;

      x += dx;
      y += dy;

      // Cap speed
      const speed = Math.hypot(dx, dy);
      if (speed > 12) {
        dx = (dx / speed) * 12;
        dy = (dy / speed) * 12;
      }

      animationId = requestAnimationFrame(draw);
    }

    function startGame() {
      resetGame();
      gameRunning = true;
      overlay.classList.add('hidden');
      draw();
    }

    // Controls
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'Right') rightPressed = true;
      if (e.key === 'ArrowLeft' || e.key === 'Left') leftPressed = true;
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowRight' || e.key === 'Right') rightPressed = false;
      if (e.key === 'ArrowLeft' || e.key === 'Left') leftPressed = false;
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      paddleX = Math.max(0, Math.min(mouseX - paddleWidth / 2, canvas.width - paddleWidth));
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;
      paddleX = Math.max(0, Math.min(touchX - paddleWidth / 2, canvas.width - paddleWidth));
    }, { passive: false });

    startBtn.addEventListener('click', startGame);

    // Initial draw
    ctx.fillStyle = '#0c0c18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
